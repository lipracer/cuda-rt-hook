name: C++ Python UnitTest CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    env:
      # Keep the GCC 13 warning from the pinned fmt non-fatal (fmtlib/fmt#3533).
      CXXFLAGS: -Wno-error=stringop-overflow

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.8
      uses: actions/setup-python@v7
      with:
        python-version: '3.8'

    - name: Run cpp tests
      run: |
        cmake -S . -B build/cpp -DCMAKE_INSTALL_PREFIX="$PWD/build/cpp" -DENABLE_BUILD_WITH_GTEST=ON
        cmake --build build/cpp --parallel 2
        ctest --test-dir build/cpp --output-on-failure

    - name: Run python tests
      run: |
        pip install build==1.0.3
        pip install wheel==0.37.1
        pip install ninja==1.11.1.1
        pip install setuptools==68.0.0
        pip install pytest

        python setup.py sdist bdist_wheel
        ls dist
        pip install --force-reinstall dist/*.whl
        pip install -r test/py_test/requirements.txt
        pytest test

    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: build/cpp/Testing/Temporary
